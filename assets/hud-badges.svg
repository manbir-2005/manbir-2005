<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 64" width="820" height="64" role="img" aria-label="Status chips: AI/ML Developer, Team Lead at UpToSkills, B.Tech CSE final year, Mode building">
  <defs>
    <linearGradient id="chipFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10192b"/>
      <stop offset="1" stop-color="#0a1322"/>
    </linearGradient>
    <linearGradient id="hudShimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#67e8f9" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#67e8f9" stop-opacity="0.13"/>
      <stop offset="1"   stop-color="#67e8f9" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- chip 1 -->
  <g>
    <rect x="6" y="12" width="188" height="40" rx="9" fill="url(#chipFill)" stroke="#1b3552" stroke-width="1"/>
    <path d="M6 21 V12 H15" fill="none" stroke="#22d3ee" stroke-width="1.4"/>
    <line x1="16" y1="13" x2="66" y2="13" stroke="#22d3ee" opacity="0.25"/>
    <circle cx="22" cy="32" r="3.2" fill="#22d3ee">
      <animate attributeName="opacity" calcMode="discrete" values="1;0.25" keyTimes="0;0.7" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="34" y="36" font-family="ui-monospace, Consolas, monospace" font-size="10" letter-spacing="1" fill="#9db8d9">AI/ML DEVELOPER</text>
  </g>

  <!-- chip 2 -->
  <g>
    <rect x="212" y="12" width="188" height="40" rx="9" fill="url(#chipFill)" stroke="#1b3552" stroke-width="1"/>
    <path d="M212 21 V12 H221" fill="none" stroke="#a78bfa" stroke-width="1.4"/>
    <line x1="222" y1="13" x2="272" y2="13" stroke="#a78bfa" opacity="0.25"/>
    <circle cx="228" cy="32" r="3.2" fill="#a78bfa">
      <animate attributeName="opacity" calcMode="discrete" values="1;0.25" keyTimes="0;0.7" dur="1.6s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <text x="240" y="36" font-family="ui-monospace, Consolas, monospace" font-size="10" letter-spacing="1" fill="#9db8d9">TEAM LEAD · UPTOSKILLS</text>
  </g>

  <!-- chip 3 -->
  <g>
    <rect x="418" y="12" width="188" height="40" rx="9" fill="url(#chipFill)" stroke="#1b3552" stroke-width="1"/>
    <path d="M418 21 V12 H427" fill="none" stroke="#7dd3fc" stroke-width="1.4"/>
    <line x1="428" y1="13" x2="478" y2="13" stroke="#7dd3fc" opacity="0.25"/>
    <circle cx="434" cy="32" r="3.2" fill="#7dd3fc">
      <animate attributeName="opacity" calcMode="discrete" values="1;0.25" keyTimes="0;0.7" dur="1.6s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <text x="446" y="36" font-family="ui-monospace, Consolas, monospace" font-size="10" letter-spacing="1" fill="#9db8d9">B.TECH CSE FINAL YEAR</text>
  </g>

  <!-- chip 4 -->
  <g>
    <rect x="624" y="12" width="188" height="40" rx="9" fill="url(#chipFill)" stroke="#1b3552" stroke-width="1"/>
    <path d="M624 21 V12 H633" fill="none" stroke="#818cf8" stroke-width="1.4"/>
    <line x1="634" y1="13" x2="684" y2="13" stroke="#818cf8" opacity="0.25"/>
    <circle cx="640" cy="32" r="3.2" fill="#818cf8">
      <animate attributeName="opacity" calcMode="discrete" values="1;0.25" keyTimes="0;0.7" dur="1.6s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="652" y="36" font-family="ui-monospace, Consolas, monospace" font-size="10" letter-spacing="1" fill="#9db8d9">MODE · BUILDING</text>
  </g>

  <!-- sweeping shimmer across the whole row -->
  <rect x="-70" y="0" width="70" height="64" fill="url(#hudShimmer)">
    <animate attributeName="x" values="-70;890" dur="7s" repeatCount="indefinite"/>
  </rect>
</svg>
