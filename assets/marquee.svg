<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 44" width="860" height="44" role="img" aria-label="Scrolling technology stream: Python, PyTorch, TensorFlow, Keras, LLMs, RAG, Prompt Engineering, NumPy, Pandas, Git, Docker, OpenCV">
  <defs>
    <linearGradient id="edgeFadeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000"/>
      <stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <linearGradient id="edgeFadeR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#000"/>
      <stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <mask id="fadeMask">
      <rect x="0" width="70" height="44" fill="url(#edgeFadeL)"/>
      <rect x="70" width="720" height="44" fill="#fff"/>
      <rect x="790" width="70" height="44" fill="url(#edgeFadeR)"/>
    </mask>
    <!-- colour wave band 1 (x 0-1600) -->
    <linearGradient id="tg1" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1600" y2="0">
      <stop offset="0"    stop-color="#67e8f9"/>
      <stop offset="0.45" stop-color="#64748b"/>
      <stop offset="0.75" stop-color="#64748b"/>
      <stop offset="1"    stop-color="#a78bfa"/>
    </linearGradient>
    <!-- colour wave band 2 (x 1600-3200) -->
    <linearGradient id="tg2" gradientUnits="userSpaceOnUse" x1="1600" y1="0" x2="3200" y2="0">
      <stop offset="0"    stop-color="#67e8f9"/>
      <stop offset="0.45" stop-color="#64748b"/>
      <stop offset="0.75" stop-color="#64748b"/>
      <stop offset="1"    stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <g mask="url(#fadeMask)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;-1600 0" dur="26s" repeatCount="indefinite"/>
      <text x="0" y="29" xml:space="preserve" font-family="ui-monospace, Consolas, monospace" font-size="12" letter-spacing="3" fill="url(#tg1)" textLength="1600" lengthAdjust="spacing">PYTHON · PYTORCH · TENSORFLOW · KERAS · LLMs · RAG · PROMPT ENGINEERING · NUMPY · PANDAS · GIT · DOCKER · OPENCV · </text>
      <text x="1600" y="29" xml:space="preserve" font-family="ui-monospace, Consolas, monospace" font-size="12" letter-spacing="3" fill="url(#tg2)" textLength="1600" lengthAdjust="spacing">PYTHON · PYTORCH · TENSORFLOW · KERAS · LLMs · RAG · PROMPT ENGINEERING · NUMPY · PANDAS · GIT · DOCKER · OPENCV · </text>
    </g>
  </g>

  <line x1="0" y1="4" x2="860" y2="4" stroke="#132643" stroke-width="1"/>
  <line x1="0" y1="40" x2="860" y2="40" stroke="#132643" stroke-width="1"/>
</svg>
