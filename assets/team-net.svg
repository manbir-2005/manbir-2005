<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 170" width="480" height="170" role="img" aria-label="AI Product Engineer team network">
  <defs>
    <linearGradient id="tnBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1020"/>
      <stop offset="1" stop-color="#08101d"/>
    </linearGradient>
    <linearGradient id="tnPulse" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glowSoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="480" height="170" rx="12" fill="url(#tnBg)" stroke="#1e3a5f" stroke-width="1"/>

  <text x="18" y="26" font-family="ui-monospace, Consolas, monospace" font-size="10" fill="#7dd3fc" letter-spacing="2" opacity="0.85">TEAM NETWORK // AI PRODUCT ENGINEERS</text>

  <!-- coordination links -->
  <g stroke="#1e3a5f" stroke-width="1.2" fill="none">
    <path d="M240 58 C 190 78, 150 92, 118 116"/>
    <path d="M240 58 L240 120"/>
    <path d="M240 58 C 290 78, 330 92, 362 116"/>
    <path d="M118 116 L240 120 L362 116" opacity="0.6"/>
  </g>

  <!-- leader node -->
  <circle cx="240" cy="58" r="24" fill="none" stroke="#67e8f9" stroke-width="1" opacity="0.5">
    <animate attributeName="r" values="16;30;16" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="240" cy="58" r="8" fill="url(#tnPulse)" filter="url(#glowSoft)"/>

  <!-- team nodes -->
  <g fill="#0b1526" stroke="#a78bfa" stroke-width="1.5">
    <circle cx="118" cy="116" r="6"/>
    <circle cx="240" cy="120" r="6"/>
    <circle cx="362" cy="116" r="6"/>
  </g>

  <!-- sync pulses -->
  <circle r="2.5" fill="#67e8f9">
    <animateMotion dur="2.6s" repeatCount="indefinite" path="M240 58 C 190 78, 150 92, 118 116"/>
  </circle>
  <circle r="2.5" fill="#c4b5fd">
    <animateMotion dur="2.6s" begin="0.9s" repeatCount="indefinite" path="M240 58 C 290 78, 330 92, 362 116"/>
  </circle>
  <circle r="2" fill="#7dd3fc">
    <animateMotion dur="2.2s" begin="1.4s" repeatCount="indefinite" path="M118 116 L240 120 L362 116"/>
  </circle>

  <!-- labels -->
  <text x="240" y="30" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="10" fill="#67e8f9" letter-spacing="1">TL · senior team leader</text>
  <g font-family="ui-monospace, Consolas, monospace" font-size="9" fill="#64748b">
    <text x="118" y="142" text-anchor="middle">ai products</text>
    <text x="240" y="146" text-anchor="middle">coordination</text>
    <text x="362" y="142" text-anchor="middle">problem solving</text>
  </g>
</svg>
