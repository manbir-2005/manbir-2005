<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" width="860" height="320" role="img" aria-label="Build modules — light theme: predictive data products (live — ocean-bed), applied AI tooling (building — forge-ai), GenAI systems (studying), team execution (active at UpToSkills)">
