<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 64" width="640" height="64" role="img" aria-label="Connection status: channel open — light theme">
  <defs>
    <linearGradient id="cbFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f2f5fb"/>
    </linearGradient>
    <linearGradient id="cbShimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7c3aed" stop-opacity="0.10"/>
      <stop offset="1"   stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="8" width="640" height="48" rx="10" fill="url(#cbFill)" stroke="#d3ddec" stroke-width="1"/>

  <text x="22" y="37" font-family="ui-monospace, Consolas, monospace" font-size="11" letter-spacing="1" fill="#0891b2">▲ CHANNEL: OPEN</text>

  <text x="320" y="36" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="10" letter-spacing="2" fill="#6b7280">ai/ml · genai · product engineering</text>

  <g fill="#0891b2">
    <rect x="534" y="34" width="6" height="8"  rx="1"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" begin="0s"   repeatCount="indefinite"/></rect>
    <rect x="546" y="27" width="6" height="15" rx="1"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" begin="0.3s" repeatCount="indefinite"/></rect>
    <rect x="558" y="20" width="6" height="22" rx="1"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" begin="0.6s" repeatCount="indefinite"/></rect>
    <rect x="570" y="13" width="6" height="29" rx="1"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" begin="0.9s" repeatCount="indefinite"/></rect>
  </g>

  <rect x="-60" y="8" width="60" height="48" fill="url(#cbShimmer)">
    <animate attributeName="x" values="-60;700" dur="9s" repeatCount="indefinite"/>
  </rect>
</svg>
