<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 170" width="480" height="170" role="img" aria-label="AI Product Engineer team network — light theme">
  <defs>
    <linearGradient id="tnBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f5fe"/>
      <stop offset="1" stop-color="#edf0fb"/>
    </linearGradient>
    <linearGradient id="tnPulse" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glowSoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="480" height="170" rx="12" fill="url(#tnBg)" stroke="#d8d4ee" stroke-width="1"/>

  <text x="18" y="26" font-family="ui-monospace, Consolas, monospace" font-size="10" fill="#6d28d9" letter-spacing="2" opacity="0.95">TEAM NETWORK // AI PRODUCT ENGINEERS</text>

  <g stroke="#cfc9ec" stroke-width="1.2" fill="none">
    <path d="M240 58 C 190 78, 150 92, 118 116"/>
    <path d="M240 58 L240 120"/>
    <path d="M240 58 C 290 78, 330 92, 362 116"/>
    <path d="M118 116 L240 120 L362 116" opacity="0.6"/>
  </g>

  <circle cx="240" cy="58" r="24" fill="none" stroke="#0891b2" stroke-width="1" opacity="0.5">
    <animate attributeName="r" values="16;30;16" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.12;0.5" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="240" cy="58" r="8" fill="url(#tnPulse)" filter="url(#glowSoft)"/>

  <g fill="#ffffff" stroke="#7c3aed" stroke-width="1.5">
    <circle cx="118" cy="116" r="6"/>
    <circle cx="240" cy="120" r="6"/>
    <circle cx="362" cy="116" r="6"/>
  </g>

  <circle r="2.5" fill="#0891b2">
    <animateMotion dur="2.6s" repeatCount="indefinite" path="M240 58 C 190 78, 150 92, 118 116"/>
  </circle>
  <circle r="2.5" fill="#7c3aed">
    <animateMotion dur="2.6s" begin="0.9s" repeatCount="indefinite" path="M240 58 C 290 78, 330 92, 362 116"/>
  </circle>
  <circle r="2" fill="#0284c7">
    <animateMotion dur="2.2s" begin="1.4s" repeatCount="indefinite" path="M118 116 L240 120 L362 116"/>
  </circle>

  <text x="240" y="30" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="10" fill="#0e7490" letter-spacing="1">TL · senior team leader</text>
  <g font-family="ui-monospace, Consolas, monospace" font-size="9" fill="#6b7280">
    <text x="118" y="142" text-anchor="middle">ai products</text>
    <text x="240" y="146" text-anchor="middle">coordination</text>
    <text x="362" y="142" text-anchor="middle">problem solving</text>
  </g>
</svg>
