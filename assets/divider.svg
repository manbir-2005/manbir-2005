<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 44" width="860" height="44" role="img" aria-label="Animated section divider">
  <defs>
    <linearGradient id="dLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#22d3ee" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#a78bfa" stop-opacity="0.9"/>
      <stop offset="0.75" stop-color="#22d3ee" stop-opacity="0.6"/>
      <stop offset="1"   stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="60" y="21" width="740" height="2" fill="url(#dLine)"/>

  <!-- travelling pulse -->
  <circle r="3.5" fill="#67e8f9">
    <animateMotion dur="4.5s" repeatCount="indefinite" path="M80 22 H780"/>
    <animate attributeName="opacity" values="0.2;1;0.2" dur="4.5s" repeatCount="indefinite"/>
  </circle>

  <!-- anchor diamonds -->
  <g fill="#8b5cf6">
    <path d="M46 22 L52 16 L58 22 L52 28 Z"/>
    <path d="M802 22 L808 16 L814 22 L808 28 Z"/>
  </g>
</svg>
