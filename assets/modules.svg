<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" width="860" height="320" role="img" aria-label="Build modules: predictive data products (live — ocean-bed), applied AI tooling (building — forge-ai), GenAI systems (studying), team execution (active at UpToSkills)">
  <defs>
    <linearGradient id="mBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1626"/>
      <stop offset="1" stop-color="#070d18"/>
    </linearGradient>
    <linearGradient id="mSweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#67e8f9" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#67e8f9" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="iBox1"><rect x="14" y="14" width="44" height="44" rx="10"/></clipPath>
    <clipPath id="iBox2"><rect x="14" y="14" width="44" height="44" rx="10"/></clipPath>
    <clipPath id="iBox3"><rect x="14" y="14" width="44" height="44" rx="10"/></clipPath>
    <clipPath id="iBox4"><rect x="14" y="14" width="44" height="44" rx="10"/></clipPath>
  </defs>

  <!-- ══════════ MODULE 01 · predictive data products ══════════ -->
  <g transform="translate(6,6)">
    <rect width="422" height="148" rx="12" fill="url(#mBg)" stroke="#1b3552" stroke-width="1"/>
    <path d="M2 16 V2 H18" fill="none" stroke="#22d3ee" stroke-width="1.4"/>
    <!-- status pill -->
    <rect x="338" y="10" width="70" height="16" rx="8" fill="none" stroke="#2dd4bf" stroke-width="1"/>
    <circle cx="349" cy="18" r="2.4" fill="#2dd4bf">
      <animate attributeName="opacity" values="1;0.25" calcMode="discrete" keyTimes="0;0.7" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="380" y="21.5" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="8.5" letter-spacing="1" fill="#2dd4bf">LIVE</text>
    <!-- icon box: flowing waves -->
    <rect x="14" y="14" width="44" height="44" rx="10" fill="#0b1420" stroke="#1e3a5f"/>
    <g clip-path="url(#iBox1)">
      <path d="M18 34 Q22 26 26 34 T34 34 T42 34 T50 34 T58 34" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="7 5" opacity="0.85">
        <animate attributeName="stroke-dashoffset" values="0;-24" dur="2.4s" repeatCount="indefinite"/>
      </path>
      <path d="M18 43 Q22 37 26 43 T34 43 T42 43 T50 43 T58 43" fill="none" stroke="#22d3ee" stroke-width="1.2" stroke-dasharray="6 6" opacity="0.4">
        <animate attributeName="stroke-dashoffset" values="0;-24" dur="3.4s" repeatCount="indefinite"/>
      </path>
      <circle cx="36" cy="22" r="3" fill="#67e8f9">
        <animate attributeName="opacity" values="0.9;0.3;0.9" dur="3s" repeatCount="indefinite"/>
      </circle>
    </g>
    <text x="70" y="36" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="14.5" letter-spacing="1" fill="#e6edf3">PREDICTIVE DATA PRODUCTS</text>
    <text x="70" y="56" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#8b949e">ocean data visualisation &amp; prediction</text>
    <!-- tag bar -->
    <rect x="14" y="112" width="394" height="22" rx="6" fill="#0a1322" stroke="#14233d"/>
    <text x="24" y="127" font-family="ui-monospace, Consolas, monospace" font-size="10" letter-spacing="1" fill="#67e8f9">→ ocean-bed.netlify.app</text>
    <rect x="-60" y="2" width="44" height="144" fill="url(#mSweep)">
      <animate attributeName="x" values="-60;470" dur="9s" begin="0s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ══════════ MODULE 02 · applied ai tooling ══════════ -->
  <g transform="translate(434,6)">
    <rect width="422" height="148" rx="12" fill="url(#mBg)" stroke="#1b3552" stroke-width="1"/>
    <path d="M2 16 V2 H18" fill="none" stroke="#22d3ee" stroke-width="1.4"/>
    <rect x="338" y="10" width="70" height="16" rx="8" fill="none" stroke="#22d3ee" stroke-width="1"/>
    <circle cx="349" cy="18" r="2.4" fill="#22d3ee">
      <animate attributeName="opacity" values="1;0.25" calcMode="discrete" keyTimes="0;0.7" dur="1.6s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
    <text x="380" y="21.5" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="8.5" letter-spacing="1" fill="#22d3ee">BUILDING</text>
    <!-- icon box: code glyph + scan -->
    <rect x="14" y="14" width="44" height="44" rx="10" fill="#0b1420" stroke="#1e3a5f"/>
    <g clip-path="url(#iBox2)">
      <text x="36" y="43" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-weight="700" font-size="14" fill="#818cf8">&lt;/&gt;</text>
      <rect x="19" y="20" width="34" height="3" fill="#67e8f9" opacity="0.55">
        <animate attributeName="y" values="20;52;20" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.55;0.12;0.55" dur="3.2s" repeatCount="indefinite"/>
      </rect>
    </g>
    <text x="70" y="36" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="14.5" letter-spacing="1" fill="#e6edf3">APPLIED AI TOOLING</text>
    <text x="70" y="56" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#8b949e">ai-powered python code analysis</text>
    <rect x="14" y="112" width="394" height="22" rx="6" fill="#0a1322" stroke="#14233d"/>
    <text x="24" y="127" font-family="ui-monospace, Consolas, monospace" font-size="10" letter-spacing="1" fill="#c4b5fd">→ github.com/ms2oo5/forge-ai</text>
    <rect x="-60" y="2" width="44" height="144" fill="url(#mSweep)">
      <animate attributeName="x" values="-60;470" dur="9s" begin="2.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ══════════ MODULE 03 · genai systems ══════════ -->
  <g transform="translate(6,166)">
    <rect width="422" height="148" rx="12" fill="url(#mBg)" stroke="#1b3552" stroke-width="1"/>
    <path d="M2 16 V2 H18" fill="none" stroke="#a78bfa" stroke-width="1.4"/>
    <rect x="338" y="10" width="70" height="16" rx="8" fill="none" stroke="#a78bfa" stroke-width="1"/>
    <circle cx="349" cy="18" r="2.4" fill="#a78bfa">
      <animate attributeName="opacity" values="1;0.25" calcMode="discrete" keyTimes="0;0.7" dur="1.6s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <text x="380" y="21.5" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="8.5" letter-spacing="1" fill="#a78bfa">STUDYING</text>
    <!-- icon box: pulsing sparkle + rotating ring -->
    <rect x="14" y="14" width="44" height="44" rx="10" fill="#0b1420" stroke="#1e3a5f"/>
    <g clip-path="url(#iBox3)">
      <circle cx="36" cy="36" r="16" fill="none" stroke="#6366f1" stroke-dasharray="4 5" opacity="0.8">
        <animate attributeName="stroke-dashoffset" values="0;-45" dur="6s" repeatCount="indefinite"/>
      </circle>
      <path d="M36 21 L39.5 32.5 L51 36 L39.5 39.5 L36 51 L32.5 39.5 L21 36 L32.5 32.5 Z" fill="#a78bfa">
        <animate attributeName="opacity" values="0.45;1;0.45" dur="3s" repeatCount="indefinite"/>
      </path>
    </g>
    <text x="70" y="36" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="14.5" letter-spacing="1" fill="#e6edf3">GENAI SYSTEMS</text>
    <text x="70" y="56" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#8b949e">llm pipelines · prompts · retrieval</text>
    <rect x="14" y="112" width="394" height="22" rx="6" fill="#0a1322" stroke="#14233d"/>
    <text x="24" y="127" font-family="ui-monospace, Consolas, monospace" font-size="10" letter-spacing="1" fill="#a78bfa">⌁ learning in public — in progress</text>
    <rect x="-60" y="2" width="44" height="144" fill="url(#mSweep)">
      <animate attributeName="x" values="-60;470" dur="9s" begin="4.4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ══════════ MODULE 04 · team execution ══════════ -->
  <g transform="translate(434,166)">
    <rect width="422" height="148" rx="12" fill="url(#mBg)" stroke="#1b3552" stroke-width="1"/>
    <path d="M2 16 V2 H18" fill="none" stroke="#818cf8" stroke-width="1.4"/>
    <rect x="338" y="10" width="70" height="16" rx="8" fill="none" stroke="#818cf8" stroke-width="1"/>
    <circle cx="349" cy="18" r="2.4" fill="#818cf8">
      <animate attributeName="opacity" values="1;0.25" calcMode="discrete" keyTimes="0;0.7" dur="1.6s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="380" y="21.5" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="8.5" letter-spacing="1" fill="#818cf8">ACTIVE</text>
    <!-- icon box: mini team network -->
    <rect x="14" y="14" width="44" height="44" rx="10" fill="#0b1420" stroke="#1e3a5f"/>
    <g clip-path="url(#iBox4)">
      <path d="M36 26 L24 48 M36 26 L48 48 M24 48 L48 48" fill="none" stroke="#1e3a5f" stroke-width="1.2"/>
      <circle cx="36" cy="26" r="4" fill="none" stroke="#67e8f9" stroke-width="1" opacity="0.6">
        <animate attributeName="r" values="4;10;4" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0.1;0.6" dur="3.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="36" cy="26" r="3.2" fill="#67e8f9"/>
      <circle cx="24" cy="48" r="2.8" fill="#0b1526" stroke="#c4b5fd" stroke-width="1.2"/>
      <circle cx="48" cy="48" r="2.8" fill="#0b1526" stroke="#c4b5fd" stroke-width="1.2"/>
      <circle r="1.8" fill="#c4b5fd">
        <animateMotion dur="2.6s" repeatCount="indefinite" path="M36 26 L24 48"/>
      </circle>
      <circle r="1.8" fill="#c4b5fd">
        <animateMotion dur="2.6s" begin="1.3s" repeatCount="indefinite" path="M36 26 L48 48"/>
      </circle>
    </g>
    <text x="70" y="36" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="14.5" letter-spacing="1" fill="#e6edf3">TEAM EXECUTION</text>
    <text x="70" y="56" font-family="'Segoe UI', Arial, sans-serif" font-size="10.5" fill="#8b949e">leading the ai product engineer team</text>
    <rect x="14" y="112" width="394" height="22" rx="6" fill="#0a1322" stroke="#14233d"/>
    <text x="24" y="127" font-family="ui-monospace, Consolas, monospace" font-size="10" letter-spacing="1" fill="#818cf8">@ uptoskills · ai product engineer team</text>
    <rect x="-60" y="2" width="44" height="144" fill="url(#mSweep)">
      <animate attributeName="x" values="-60;470" dur="9s" begin="6.6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
